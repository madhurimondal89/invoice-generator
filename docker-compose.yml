version: '3.8'

services:
  invoice-genius:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoice-genius:latest
    container_name: invoice-genius
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Optional external database (if omitted, runs robust in-memory mode)
      - DATABASE_URL=${DATABASE_URL:-}
      # Optional session secret
      - SESSION_SECRET=${SESSION_SECRET:-invoicegenius-super-secure-production-secret-key}
      # Optional SES credentials for email functionality
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
